name: Build Utilities AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'utilities-online/**'
      - '.github/workflows/utilities-appimage.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Utilities AppImage
        run: |
          chmod +x utilities-online/AppRun utilities-online/install-utilities.sh utilities-online/build.sh
          cd utilities-online
          ./build.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huzaifah-Utilities-ONLINE-v1.0.0-x86_64
          if-no-files-found: error
          path: |
            utilities-online/Huzaifah-Utilities-ONLINE-v1.0.0-x86_64.AppImage
            utilities-online/Huzaifah-Utilities-ONLINE-v1.0.0-x86_64.AppImage.sha256
