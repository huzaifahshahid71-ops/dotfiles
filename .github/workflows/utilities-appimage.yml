name: Build Utilities AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'utilities-online/**'
      - '!utilities-online/Huzaifah-Utilities-ONLINE-*.AppImage'
      - '!utilities-online/Huzaifah-Utilities-ONLINE-*.AppImage.sha256'
      - '.github/workflows/utilities-appimage.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Utilities AppImage
        run: |
          chmod +x utilities-online/AppRun utilities-online/install-utilities.sh utilities-online/build.sh
          cd utilities-online
          ./build.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huzaifah-Utilities-ONLINE-v1.0.0-x86_64
          if-no-files-found: error
          path: |
            utilities-online/Huzaifah-Utilities-ONLINE-v1.0.0-x86_64.AppImage
            utilities-online/Huzaifah-Utilities-ONLINE-v1.0.0-x86_64.AppImage.sha256

      - name: Commit built AppImage to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utilities-online/Huzaifah-Utilities-ONLINE-v1.0.0-x86_64.AppImage \
                  utilities-online/Huzaifah-Utilities-ONLINE-v1.0.0-x86_64.AppImage.sha256
          if git diff --cached --quiet; then
            echo 'Built files are already up to date.'
          else
            git commit -m 'Update built Utilities AppImage'
            git push origin HEAD:main
          fi
