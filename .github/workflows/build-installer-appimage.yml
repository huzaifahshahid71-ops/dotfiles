name: Build Multi-Rice Installer AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "installer-appimage/**"
      - ".github/workflows/build-installer-appimage.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare AppDir
        run: |
          set -euo pipefail
          mkdir -p build/AppDir dist
          cp installer-appimage/AppRun build/AppDir/AppRun
          cp installer-appimage/huzaifah-triple-rice-installer.desktop build/AppDir/
          cp installer-appimage/huzaifah-triple-rice-installer.svg build/AppDir/
          ln -s huzaifah-triple-rice-installer.svg build/AppDir/.DirIcon
          chmod +x build/AppDir/AppRun

      - name: Download appimagetool
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o build/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          set -euo pipefail
          APPIMAGE_EXTRACT_AND_RUN=1 build/appimagetool-x86_64.AppImage \
            build/AppDir \
            dist/Huzaifah-Multi-Rice-Installer-x86_64.AppImage
          chmod +x dist/Huzaifah-Multi-Rice-Installer-x86_64.AppImage
          tar -C dist -czf dist/Huzaifah-Multi-Rice-Installer-x86_64.tar.gz \
            Huzaifah-Multi-Rice-Installer-x86_64.AppImage
          sha256sum \
            dist/Huzaifah-Multi-Rice-Installer-x86_64.AppImage \
            dist/Huzaifah-Multi-Rice-Installer-x86_64.tar.gz \
            > dist/SHA256SUMS.txt

      - name: Smoke-test AppImage structure and launcher
        run: |
          set -euo pipefail
          rm -rf squashfs-root
          dist/Huzaifah-Multi-Rice-Installer-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          bash -n installer-appimage/AppRun
          bash -n squashfs-root/AppRun
          grep -F 'TITLE="Huzaifah Multi-Rice Installer"' squashfs-root/AppRun >/dev/null
          grep -F 'DankMaterialShell' squashfs-root/AppRun >/dev/null
          if grep -F 'bash -c "$(curl' installer-appimage/AppRun >/dev/null; then
            echo 'Unsafe curl-to-bash launcher pattern detected'
            exit 1
          fi
          grep -F 'installer_file="$(mktemp --suffix=.sh)"' installer-appimage/AppRun >/dev/null
          grep -F 'bash "$installer_file"' installer-appimage/AppRun >/dev/null

      - name: Write release notes
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # Huzaifah Multi-Rice Installer v2.0.0

          The installer has grown from Triple-Rice into a dynamic **Multi-Rice** setup.

          **Installs:**
          - ✦ Caelestia
          - ◈ end4-pC
          - ◆ Ambxst with axctl integration
          - ● DankMaterialShell (DMS 1.5.3 profile)
          - ⇄ `SUPER + SHIFT + D` dynamic profile switcher
          - 🌙 Frieren SDDM login theme
          - saved end4/Ambxst fixes and repository configuration

          **DMS integration:**
          - DMS starts only from its own Hyprland profile (`dms run`), not as a global user service
          - bare `SUPER` opens the DMS application launcher
          - `SUPER + SHIFT + S` opens DMS region screenshot capture
          - `SUPER + SHIFT + D` opens the Multi-Rice switcher
          - Alacritty is the DMS terminal

          This is the lightweight **online** AppImage. It downloads the normal repository installer and upstream packages during setup rather than embedding the full package payload.

          **Requirements:** x86_64 Arch/CachyOS-family Linux, internet access, sudo privileges, and a graphical desktop session.

          The installer does not choose or replace your desktop wallpaper. The Frieren image is used only by the SDDM login theme.

          The `.tar.gz` asset contains the same AppImage while preserving the executable bit after extraction. `SHA256SUMS.txt` contains checksums for both assets.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="multi-rice-installer-v2.0.0"
          TITLE="Huzaifah Multi-Rice Installer v2.0.0"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$TAG" \
              dist/Huzaifah-Multi-Rice-Installer-x86_64.AppImage \
              dist/Huzaifah-Multi-Rice-Installer-x86_64.tar.gz \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              dist/Huzaifah-Multi-Rice-Installer-x86_64.AppImage \
              dist/Huzaifah-Multi-Rice-Installer-x86_64.tar.gz \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Record successful release
        run: |
          set -euo pipefail
          mkdir -p release-status
          cat > release-status/multi-rice-installer-v2.0.0.txt <<EOF
          Release: Huzaifah Multi-Rice Installer v2.0.0
          Tag: multi-rice-installer-v2.0.0
          Built from: $GITHUB_SHA
          Workflow run: $GITHUB_RUN_ID
          Published: $(date --iso-8601=seconds)
          Assets:
            Huzaifah-Multi-Rice-Installer-x86_64.AppImage
            Huzaifah-Multi-Rice-Installer-x86_64.tar.gz
            SHA256SUMS.txt
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add release-status/multi-rice-installer-v2.0.0.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Multi-Rice AppImage v2.0.0 release"
            git push origin HEAD:main
          fi
