name: v6 Tahoe alpha checks
on:
  push:
    branches: [v6.0-tahoe-dev]
  pull_request:
    branches: [main]
    paths:
      - "v6/tahoe/**"
      - ".github/workflows/v6-tahoe-alpha.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bash and Qt syntax tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck qt6-declarative-dev-tools
      - name: Check preview script without running it
        run: |
          bash -n v6/tahoe/preview.sh
          bash -n v6/tahoe/build-glass.sh
          bash -n v6/tahoe/nested-probe.sh
          bash -n v6/tahoe/nested-glass.sh
          shellcheck -S error v6/tahoe/preview.sh
          shellcheck -S error v6/tahoe/build-glass.sh
          shellcheck -S error v6/tahoe/nested-probe.sh
          shellcheck -S error v6/tahoe/nested-glass.sh
          test -f v6/tahoe/shell.qml
          test -s v6/tahoe/session/hyprland.lua
          bash -n v6/tahoe/session/zephyrus-tahoe-session
          bash -n v6/tahoe/session/install-tahoe-session.sh
          shellcheck -S error v6/tahoe/session/zephyrus-tahoe-session
          shellcheck -S error v6/tahoe/session/install-tahoe-session.sh
          test -s v6/tahoe/session/zephyrus-tahoe.desktop
          grep -Fq 'Name=ZEPHYRUS Tahoe (Experimental)' v6/tahoe/session/zephyrus-tahoe.desktop
          grep -Fq 'Exec=/usr/local/bin/zephyrus-tahoe-session' v6/tahoe/session/zephyrus-tahoe.desktop
          grep -Fq 'exec start-hyprland -- --config "$config"' v6/tahoe/session/zephyrus-tahoe-session
          ! grep -Eq '^[[:space:]]*(sudo|pacman|hyprctl|hyprpm|pkill|systemctl)([[:space:]]|$)' v6/tahoe/session/zephyrus-tahoe-session
          grep -Fq -- '--check|--install|--rollback' v6/tahoe/session/install-tahoe-session.sh
          grep -Fq 'Type exactly INSTALL TAHOE to continue' v6/tahoe/session/install-tahoe-session.sh
          grep -Fq 'state.conf are not modified' v6/tahoe/session/install-tahoe-session.sh
          grep -Fq 'Hyprland --verify-config --config' v6/tahoe/session/install-tahoe-session.sh
          ! grep -Eq '^[[:space:]]*(pacman|hyprpm|hyprctl[[:space:]]+plugin|systemctl[[:space:]]+(enable|disable))([[:space:]]|$)' v6/tahoe/session/install-tahoe-session.sh
          ! grep -Fq '/var/lib/sddm/state.conf' v6/tahoe/session/install-tahoe-session.sh
          grep -Fq 'hl.bind("SUPER + SHIFT + E", hl.dsp.exit())' v6/tahoe/session/hyprland.lua
          grep -Fq 'hl.exec_cmd("foot")' v6/tahoe/session/hyprland.lua
          ! grep -Eq 'hl[.]plugin[.]load|hyprpm|systemctl|sudo|pacman' v6/tahoe/session/hyprland.lua
          ! grep -Eq 'require[(]|loadfile[(]|dofile[(]' v6/tahoe/session/hyprland.lua
          grep -q 'ExclusionMode.Ignore' v6/tahoe/shell.qml
          grep -q 'Hyprland.toplevels' v6/tahoe/shell.qml
          grep -q 'Qt.quit()' v6/tahoe/shell.qml
          ! grep -Eq '^[[:space:]]*(sudo|pacman|hyprctl|pkill)([[:space:]]|$)' v6/tahoe/preview.sh
          ! grep -Eq '^[[:space:]]*(sudo|pacman|hyprctl|hyprpm|pkill|systemctl)([[:space:]]|$)' v6/tahoe/build-glass.sh
          grep -q 'c5442379542dc5e5c91cc385e3168172dd9d5ff9' v6/tahoe/build-glass.sh
          grep -q 'HYPRLAND_NO_SD_VARS=1' v6/tahoe/nested-probe.sh
          grep -q 'Hyprland --verify-config' v6/tahoe/nested-probe.sh
          grep -q 'HYPRLAND_NO_SD_VARS=1' v6/tahoe/nested-glass.sh
          grep -Fq 'hl.plugin.load([[$PLUGIN]])' v6/tahoe/nested-glass.sh
          grep -Fq '[colors-dark]' v6/tahoe/nested-glass.sh
          grep -Fq 'foot --check-config --config=' v6/tahoe/nested-glass.sh
          ! grep -qx '\[colors\]' v6/tahoe/nested-glass.sh
          ! grep -Eq '^[[:space:]]*(sudo|pacman|hyprctl plugin|hyprpm|pkill|systemctl)([[:space:]]|$)' v6/tahoe/nested-glass.sh
          ! grep -Eq '^[[:space:]]*(sudo|pacman|hyprctl plugin|hyprpm|pkill|systemctl)([[:space:]]|$)' v6/tahoe/nested-probe.sh
      - name: Parse QML with Qt qmlformat
        run: |
          tool="$(command -v qmlformat || true)"
          if [[ -z "$tool" && -x /usr/lib/qt6/bin/qmlformat ]]; then
            tool=/usr/lib/qt6/bin/qmlformat
          fi
          test -x "$tool" || { echo "qmlformat unavailable"; exit 1; }
          cp v6/tahoe/shell.qml /tmp/tahoe-qml-alpha.qml
          "$tool" -i /tmp/tahoe-qml-alpha.qml
          test -s /tmp/tahoe-qml-alpha.qml
