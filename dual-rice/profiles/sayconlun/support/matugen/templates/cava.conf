# Generated by matugen from {{image}} - do not edit.
# The source is ~/.local/share/desktop-profiles/sayconlun/support/matugen/templates/cava.conf.
[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0            ; 0 = fit the window width
bar_width = 2
bar_spacing = 1
# Re-read this file when it changes, so a new wallpaper recolours a running cava.
live-config = 1

[input]
# PipeWire's Pulse server; `auto` picks the default sink's monitor.
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[color]
# dark -> light through the palette, so the bars keep their shape and only
# their hue follows the wallpaper
gradient = 1
gradient_count = 6
gradient_color_1 = '{{colors.outline_variant.default.hex}}'
gradient_color_2 = '{{colors.secondary.default.hex}}'
gradient_color_3 = '{{colors.primary.default.hex}}'
gradient_color_4 = '{{colors.primary_fixed_dim.default.hex}}'
gradient_color_5 = '{{colors.tertiary.default.hex}}'
gradient_color_6 = '{{colors.on_surface.default.hex}}'

[smoothing]
noise_reduction = 45
