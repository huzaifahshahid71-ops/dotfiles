# Lock screen. The wallpaper and colours come from hyprlock-colors.conf, so it always
# matches the desktop it is covering. Clear the password with Esc or Ctrl+U.
source = ~/.config/hypr/hyprlock-colors.conf

$font = Inter Variable

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = expoOut, 0.19, 1.0, 0.22, 1.0
    animation = fadeIn, 1, 5, expoOut
    animation = fadeOut, 1, 4, expoOut
    animation = inputFieldDots, 1, 2, expoOut
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.2
}

# time
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%I:%M)</b>"
    color = $text
    font_size = 110
    font_family = $font
    position = 0, 190
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = -1
    inner_color = $glass
    outer_color = $primary $tertiary 45deg
    check_color = $tertiary
    fail_color = $error
    font_color = $text
    font_family = $font
    placeholder_text = password
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰀄   $USER
    color = $subtext
    font_size = 13
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
